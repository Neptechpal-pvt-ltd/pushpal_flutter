name: pushpal_flutter
description: "PushPal for Flutter: push notifications, in-app messages, inbox, user identity, events and attribution. Pure Dart; attaches to your existing firebase_messaging."
version: 1.2.0
homepage: https://push.neptechpal.com.np
repository: https://github.com/Neptechpal-pvt-ltd/pushpal_flutter
issue_tracker: https://github.com/Neptechpal-pvt-ltd/pushpal_flutter/issues
documentation: https://push.neptechpal.com.np/docs#flutter
topics:
  - push-notifications
  - notifications
  - firebase
  - in-app-messaging
  - analytics

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.1.0 <2.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
